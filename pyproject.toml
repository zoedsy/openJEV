[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.1.0"
description = "Local, open-source typed AI decisions inspired by TypeSafe's Jev API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "onnxruntime>=1.22,<2",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
openjev = "openjev.__main__:main"

[tool.setuptools.package-data]
openjev = ["static/*", "examples.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: runs inference using downloaded model weights"]

[tool.setuptools.packages.find]
include = ["openjev*"]
