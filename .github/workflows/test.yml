name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install fastapi uvicorn httpx pytest
      - run: python -m pytest -q -m 'not model'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/tickets.test.cjs tests/tickets-browser.test.cjs tests/playground-browser.test.cjs
